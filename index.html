<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1530">
<title>PS4 Jailbreak FW 7.00-13.52</title>
<link rel="stylesheet" href="style.css">
<script src="result-images.js" defer></script>
</head>
<body class="g2all-page">
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);
var jailbreakStarted = false;
function supportedFirmware() {
    return fwNum == 5.05 || fwNum == 5.07 ||
        (fwNum >= 7.00 && fwNum <= 8.52) ||
        (fwNum >= 9.00 && fwNum <= 9.60) ||
        (fwNum >= 10.00 && fwNum <= 11.02) ||
        (fwNum >= 11.50 && fwNum <= 12.02) ||
        (fwNum >= 12.50 && fwNum <= 13.00) ||
        (fwNum >= 13.02 && fwNum <= 13.52);
}
document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("detectedFirmware").textContent = isPS4 ? fwVersion : "Unknown (not PS4)";
    document.getElementById("startJailbreakBtn").disabled = !isPS4 || !supportedFirmware();
    if (!isPS4) msgs.textContent = "Only for PS4 with Firmware 5.05 and 7.00 to 13.52";
    else if (!supportedFirmware()) msgs.textContent = "Unsupported Firmware: " + fwVersion;
    else msgs.textContent = "Ready — Click the PlayStation logo";
});

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

function startJailbreak() {
if (jailbreakStarted || !isPS4 || !supportedFirmware()) return;
jailbreakStarted = true;
document.getElementById("startJailbreakBtn").disabled = true;
msgs.innerHTML = "Loading <span class=\"gold\">GoldHEN</span>... Please Wait";
if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 13.52";
    });
} else {
    if (window.applicationCache && window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=10";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
}
</script>
<main class="g2all-center">
  <button id="startJailbreakBtn" class="logo-start-btn" type="button" onclick="startJailbreak()" aria-label="Start Jailbreak" disabled>
    <img src="playstation-logo.png" alt="PlayStation" width="300" height="200">
  </button>
  <div class="status-card">
    <div class="status-head">
      <div class="ready-state"><span class="ready-dot"></span><span>Ready</span></div>
      <div class="meta">Firmware Detected: <span id="detectedFirmware" class="firmware-number">Detecting...</span></div>
    </div>
    <h1 id="msgs" class="g2all-msg">Ready — Click the PlayStation logo</h1>
  </div>
  <footer class="g2all-footer">ZoLDiK
  </footer>
</main>
</body>
</html>
